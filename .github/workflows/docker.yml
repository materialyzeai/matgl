name: Docker

# Builds the materialyzeai/matgl images from this source tree (docker/) and
# pushes them to Docker Hub when a release is published:
#
#   materialyzeai/matgl:<version>, :latest                         docker/Dockerfile             amd64 + arm64
#   materialyzeai/matgl:<version>-kokkos-cpu, :latest-kokkos-cpu   docker/Dockerfile.kokkos-cpu  amd64
#
# The images install matgl from the release checkout, not PyPI, so they do not
# wait on the PyPI upload in test.yml. docker/Dockerfile.kokkos (CUDA) is not
# built here; GitHub-hosted runners lack the disk space for it.
#
# Pull requests touching the images build and smoke-test them without pushing.
# workflow_dispatch does the same; tick `push` to publish. Dispatching from a
# release tag (re)publishes that release, including the `latest` tags; from a
# branch it pushes only the dev-version tag.

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
        description: Push the images to Docker Hub.

env:
  IMAGE: materialyzeai/matgl

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      push: ${{ steps.version.outputs.push }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Determine version and tags
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          set -euo pipefail
          version="$(uvx --from setuptools-scm python -m setuptools_scm)"
          if [[ "$GITHUB_EVENT_NAME" == release && "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::setuptools-scm version $version does not match release tag $RELEASE_TAG"
            exit 1
          fi
          push=false
          if [[ "$GITHUB_EVENT_NAME" == release || "$PUSH_INPUT" == true ]]; then push=true; fi
          latest=false
          if [[ "$push" == true && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then latest=true; fi
          {
            echo "version=$version"
            echo "tag=${version//+/-}"  # '+' (PEP 440 local version) is not valid in a Docker tag.
            echo "latest=$latest"
            echo "push=$push"
          } | tee -a "$GITHUB_OUTPUT"

  matgl:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MATGL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # The default (CUDA) torch wheel makes the amd64 image several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: MATGL_VERSION=${{ env.MATGL_VERSION }}
          load: true
          tags: matgl:ci
      - name: Smoke test
        run: |
          docker run --rm -e MATGL_VERSION matgl:ci bash -c '
            set -euo pipefail
            python -c "import os, matgl; print(\"matgl\", matgl.__version__); assert matgl.__version__ == os.environ[\"MATGL_VERSION\"]"
            mgl --help > /dev/null
          '
      - name: Login to Docker Hub
        if: needs.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      # amd64 layers are reused from the build above via the builder's local cache.
      - name: Build and push (amd64 + arm64)
        if: needs.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: MATGL_VERSION=${{ env.MATGL_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}

  kokkos-cpu:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MATGL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.kokkos-cpu
          platforms: linux/amd64
          build-args: |
            MATGL_VERSION=${{ env.MATGL_VERSION }}
            BUILD_JOBS=4
          load: true
          tags: matgl:ci-kokkos-cpu
          cache-from: type=gha,scope=kokkos-cpu
          cache-to: type=gha,mode=max,scope=kokkos-cpu
      - name: Smoke test
        run: |
          docker run --rm -e MATGL_VERSION matgl:ci-kokkos-cpu bash -c '
            set -euo pipefail
            lmp -h | tee /tmp/lmp_help.txt
            grep -qw "matgl"    /tmp/lmp_help.txt
            grep -qw "matgl/kk" /tmp/lmp_help.txt
            grep -q  "KOKKOS"   /tmp/lmp_help.txt
            python -c "import os, matgl, torch; print(\"matgl\", matgl.__version__, \"torch\", torch.__version__); assert matgl.__version__ == os.environ[\"MATGL_VERSION\"]"
            # In-process LAMMPS sharing the Python libtorch.
            python -c "
          import matgl
          from lammps import lammps
          lmp = lammps(cmdargs=[\"-log\", \"none\", \"-screen\", \"none\", \"-k\", \"on\", \"t\", \"1\", \"-sf\", \"kk\"])
          for style in (\"matgl\", \"matgl/kk\", \"snap\"):
              assert lmp.has_style(\"pair\", style), style
          print(lmp.version(), lmp.installed_packages)
          "
            mgl create-lammps-model --help > /dev/null
          '
      - name: Login to Docker Hub
        if: needs.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Push
        if: needs.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.kokkos-cpu
          platforms: linux/amd64
          build-args: |
            MATGL_VERSION=${{ env.MATGL_VERSION }}
            BUILD_JOBS=4
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}-kokkos-cpu
            ${{ needs.version.outputs.latest == 'true' && format('{0}:latest-kokkos-cpu', env.IMAGE) || '' }}
          cache-from: type=gha,scope=kokkos-cpu
