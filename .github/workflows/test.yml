name: Test

on:
  push:
    branches: ["*"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [tests, release]
        default: tests
        description: Only run tests or release a new version to PyPI after tests pass.

jobs:
  test:
    strategy:
      max-parallel: 20
      matrix:
        config:
          - os: ubuntu-latest
            python: "3.13"
            optionals: "ops"
          - os: ubuntu-latest
            python: "3.13"
            optionals: "alchmtk"
          - os: ubuntu-latest
            python: "3.13"
            optionals: "jax"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"

    runs-on: ${{ matrix.config.os }}
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: "python"
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.config.python }}
      - name: Virtual env
        run: uv venv --python ${{ matrix.config.python }} --clear
      - name: Install dependencies
        run: |
          uv sync --upgrade
          uv pip install -e ".[${{ matrix.config.optionals }}]"
          uv pip install pytest pytest-cov
      - name: pytest
        run: |
          uv run python -c "import torch; print(torch.__version__)"
          uv run pytest --cov=matgl --cov-report=xml --cov-report=term tests --color=yes
      - name: Upload coverage artifacts
        if: matrix.config.optionals == 'ops'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage
          path: .
          merge-multiple: true
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: github.event_name == 'release' || inputs.task == 'release'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      # For pypi trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the published release from its tag so setuptools-scm can
          # derive the distribution version from that tag.
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
